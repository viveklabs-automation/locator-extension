        <label>
          Password
          <input _ngcontent-ng-c10001="" type="password" placeholder="Enter password" />
        </label>

        <button type="submit" _ngcontent-ng-c10001="" title="Submit Form Tooltip">Log In</button>

        <h2 class="Card_title__m3n4o">Alpha User</h2>
        <img class="Avatar_img__5p6q7" src="alpha.jpg" alt="Alpha Avatar" />
        <button class="Button_btn__1a2b3 Button_primary__4c5d6">Save Changes</button>
      </div>

      <div class="Card_wrapper__x9y8z" data-testid="user-card-beta">

        <img class="Avatar_img__5p6q7" src="beta.jpg" alt="Beta Avatar" />
        <button class="Button_btn__1a2b3 Button_primary__4c5d6">Save Changes</button>
      </div>
    </section>

    <!-- Duplicate items to verify .filter() and .nth() -->

        <li class="notification-item">Dismiss</li>
        <li class="notification-item">Dismiss</li>
        <li class="notification-item">Dismiss</li>
