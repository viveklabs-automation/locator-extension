<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Playwright Locator Generator</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
      width: 380px;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #334155;
    }

    .help-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      background: #ffffff;
    }

    .priority-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
    }

    .priority-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }

    .priority-item:last-child {
      border-bottom: none;
    }

    .priority-actions button {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 11px;
    }

    .priority-actions button:hover {
      background: #e2e8f0;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    button.btn {
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
    }

    button.btn-primary {
      background: #2563eb;
      color: #fff;
    }

    button.btn-primary:hover {
      background: #1d4ed8;
    }

    button.btn-secondary {
      background: #fff;
      border-color: #cbd5e1;
      color: #475569;
    }

    button.btn-secondary:hover {
      background: #f8fafc;
    }

    #status {
      font-size: 11px;
      color: #16a34a;
      margin-top: 8px;
      min-height: 16px;
      text-align: right;
    }
  </style>
</head>
<body>
  <h2>Locator Settings</h2>

  <div class="form-group">
    <label for="testIdAttr">Test ID Attribute Name</label>
    <input type="text" id="testIdAttr" placeholder="data-testid" />
    <div class="help-text">E.g., data-testid, data-test, data-cy, test-id</div>
  </div>

  <div class="form-group">
    <label for="defaultLanguage">Default Output Language</label>
    <select id="defaultLanguage">
      <option value="typescript">TypeScript</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
    </select>
  </div>

  <div class="form-group">
    <label>Locator Priority Order</label>
    <ul class="priority-list" id="priorityList"></ul>
    <div class="help-text">Use arrows to adjust evaluation order.</div>
  </div>

  <div class="footer">
    <button class="btn btn-secondary" id="resetBtn">Reset</button>
    <button class="btn btn-primary" id="saveBtn">Save Settings</button>
  </div>
  <div id="status"></div>

  <script type="module" src="./settings.ts"></script>
</body>
</html>
